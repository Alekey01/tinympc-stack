# tinympc: el ESP32 decide con TinyMPC; este stack es su puente con las APIs de
# Cuby y sirve el panel. Variables en .env (ver .env.example).
#
# Todo entra por Traefik (red externa "proxy", HTTPS con el certificado
# *.cubytest.space); no se publican puertos en el host (el firewall solo deja
# 22/80/443):
#   https://${PANEL_DOMINIO}   -> panel (con usuario y contrasena)
#   wss://${MQTT_DOMINIO}      -> broker MQTT por WebSocket (el ESP32 se conecta aqui)
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    entrypoint: ["/bin/sh", "/mosquitto/config/arranque.sh"]
    environment:
      MQTT_USUARIO: ${MQTT_USUARIO}
      MQTT_CLAVE: ${MQTT_CLAVE}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.tinympc-mqtt.rule: Host(`${MQTT_DOMINIO:-mqtt-tinympc.cubytest.space}`)
      traefik.http.routers.tinympc-mqtt.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.tinympc-mqtt.tls: "true"
      traefik.http.services.tinympc-mqtt.loadbalancer.server.port: "9001"
    restart: unless-stopped

  puente:
    build: ./app
    image: tinympc-app:local
    pull_policy: build        # se construye aqui; no existe en ningun registro
    command: ["python", "-u", "puente.py"]
    environment:
      CUBY_USUARIO: ${CUBY_USUARIO}
      CUBY_CLAVE: ${CUBY_CLAVE}
      TERRA_MAC: ${TERRA_MAC:-F09E9E1EB52C}
      MODO_ENVIO: ${MODO_ENVIO:-enviar}
      MQTT_HOST: mosquitto
      MQTT_USUARIO: ${MQTT_USUARIO}
      MQTT_CLAVE: ${MQTT_CLAVE}
      PLACA_ID: ${PLACA_ID:-cocina}
      MODO_MPC: ${MODO_MPC:-normal}
      ANTICIPAR: ${ANTICIPAR:-0}
      DATOS: /datos
    volumes:
      - datos:/datos
    depends_on:
      - mosquitto
    stop_grace_period: 30s   # al detenerse restaura el apagado por vacio del TERRA
    restart: unless-stopped

  panel:
    image: tinympc-app:local   # la que construye el servicio puente
    pull_policy: never
    command: ["python", "-u", "panel.py"]
    environment:
      PANEL_USUARIO: ${PANEL_USUARIO}
      PANEL_CLAVE: ${PANEL_CLAVE}
      DATOS: /datos
    volumes:
      - datos:/datos:ro
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.tinympc-panel.rule: Host(`${PANEL_DOMINIO:-tinympc.cubytest.space}`)
      traefik.http.routers.tinympc-panel.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.tinympc-panel.tls: "true"
      traefik.http.services.tinympc-panel.loadbalancer.server.port: "8765"
    depends_on:
      - puente
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  datos:
