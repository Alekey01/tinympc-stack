# Broker del stack. Sin usuarios anonimos.
# 1883: solo dentro del stack (el puente).
# 9001: WebSocket, publicado por Traefik como wss:// (el ESP32 se conecta aqui).
listener 1883
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/data/passwd
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
